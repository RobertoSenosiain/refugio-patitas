<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refugio Patitas</title>
<style>
:root{
  --bg:#E4F0EA; --surface:#FFFFFF; --ink:#15322C; --muted:#4B6860;
  --green:#1D6A54; --th-ink:#FFFFFF; --teal:#1E9E8C; --teal-soft:#CDEEE8;
  --kraft:#E2CC9C; --kraft-dark:#B89A62; --kraft-ink:#3F321D;
  --amber:#F3B63F; --amber-soft:#FCEBC2; --coral:#C94A40; --coral-soft:#F8DAD6;
  --ok:#23845A; --ok-soft:#D5F0E0; --line:#B9D3CA;
  --reg:#2B63C9; --reg-soft:#DCE7FA; --cam:#2F8A3B; --cam-soft:#DDF1DF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1E1A; --surface:#16302A; --ink:#E3F0EB; --muted:#A3BFB6;
    --green:#58C3A6; --th-ink:#0E1E1A; --teal:#3CC3AE; --teal-soft:#1C4A42;
    --amber-soft:#4A3B16; --coral:#F07A6E; --coral-soft:#4A2320;
    --ok:#5CCB93; --ok-soft:#1B3F2E; --line:#2E4E46; --reg:#7FA8F0; --reg-soft:#1E2F52; --cam:#6CCB78; --cam-soft:#1D3D22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1E1A; --surface:#16302A; --ink:#E3F0EB; --muted:#A3BFB6;
  --green:#58C3A6; --th-ink:#0E1E1A; --teal:#3CC3AE; --teal-soft:#1C4A42;
  --amber-soft:#4A3B16; --coral:#F07A6E; --coral-soft:#4A2320;
  --ok:#5CCB93; --ok-soft:#1B3F2E; --line:#2E4E46; --reg:#7FA8F0; --reg-soft:#1E2F52; --cam:#6CCB78; --cam-soft:#1D3D22; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Verdana","DejaVu Sans",sans-serif;font-size:17px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;
  max-width:1100px;margin:0 auto;padding:14px 18px}
.marca{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:1.15rem}
.marca .huella{width:38px;height:38px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:1.2rem}
.estado{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pasos{display:flex;gap:6px}
.paso{height:34px;padding:0 12px;border-radius:20px;border:2px solid var(--line);display:grid;place-items:center;font-weight:bold;font-size:.9rem;color:var(--muted);background:var(--surface);white-space:nowrap}
.paso.actual{border-color:var(--green);background:var(--green);color:var(--th-ink)}
.paso.hecho{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.equipo{padding:5px 12px;border-radius:20px;border:2px solid var(--line);background:var(--surface);font-weight:bold;font-size:.9rem}
.mini{padding:6px 12px;border-radius:20px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9rem}
.mini:hover{border-color:var(--teal)}

main{max-width:1100px;margin:0 auto;padding:0 18px 30px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:24px 26px;margin-top:6px}
h1{font-size:2.3rem;line-height:1.1;margin:0 0 10px;letter-spacing:-.5px}
h2{font-size:1.5rem;margin:0 0 8px;line-height:1.2}
.etapa{color:var(--muted);font-size:.95rem;margin:0 0 2px}
.consigna{margin:0 0 14px;max-width:70ch}
.rol{font-size:.9rem;color:var(--muted);margin:-6px 0 14px}

.btn{background:var(--green);color:var(--th-ink);border:none;border-radius:12px;padding:12px 22px;font-weight:bold;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acciones{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Portada */
.portada{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:34px;align-items:center}
.pila{position:relative;height:280px}
.pila .ficha{position:absolute;width:78%;max-width:290px}
.pila .ficha:nth-child(1){top:10px;left:4%;transform:rotate(-7deg)}
.pila .ficha:nth-child(2){top:60px;left:18%;transform:rotate(4deg)}
.pila .ficha:nth-child(3){top:118px;left:8%;transform:rotate(-2deg)}
.equipos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:360px;margin:8px 0 4px}
.equipos button{padding:10px 0;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:bold}
.equipos button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#2A2010}

.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 4px;max-width:520px}
.rolc{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.92rem;line-height:1.3}
.rolc .ri{font-size:1.5rem;line-height:1}
.rolc b{display:block}
.rolc.tres{grid-column:1/-1;border-style:dashed}
.preg{font-size:1.25rem;font-weight:bold;max-width:620px;margin:6px auto 16px;padding:16px 20px;border-radius:14px;background:var(--amber-soft);border:2px dashed var(--amber)}
.notas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.nota{background:var(--kraft);color:var(--kraft-ink);border-radius:8px;padding:12px 14px;font-family:"Courier New","Liberation Mono","DejaVu Sans Mono",monospace;line-height:1.5;box-shadow:0 3px 0 var(--kraft-dark)}
.nota .q{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;font-family:"Trebuchet MS","Verdana","DejaVu Sans",sans-serif}
.nota .q .ql{flex-basis:100%;font-size:.9rem}
.nota .q .opt{padding:6px 16px}
.nota .q .opt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--th-ink);font-weight:bold}
.nota.ok{outline:3px solid var(--ok)}
@media (max-width:760px){.notas{grid-template-columns:1fr}.roles{grid-template-columns:1fr}}
/* Ficha de cartón: el elemento protagonista */
.ficha{background:var(--kraft);color:var(--kraft-ink);border-radius:6px;padding:26px 20px 16px;position:relative;
  font-family:"Courier New","Liberation Mono","DejaVu Sans Mono",monospace;font-size:1rem;line-height:1.9;
  box-shadow:0 3px 0 var(--kraft-dark);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.9em - 1px),rgba(63,50,29,.22) calc(1.9em - 1px),rgba(63,50,29,.22) 1.9em);
  background-origin:content-box;background-clip:padding-box}
.ficha::before{content:"";position:absolute;top:-7px;left:50%;width:48px;height:16px;margin-left:-24px;border-radius:4px;background:#8FA09A;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ficha .titulo{font-weight:bold;text-decoration:underline}
.ficha.grande{transform:rotate(-1.5deg);max-width:420px}

/* Misión 1 */
.m1-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.chip{background:var(--kraft);color:var(--kraft-ink);border:2px solid var(--kraft-dark);border-radius:10px;padding:8px 16px;cursor:pointer;
  font-family:"Courier New","Liberation Mono","DejaVu Sans Mono",monospace;font-weight:bold;font-size:1.05rem}
.chip[aria-pressed="true"]{outline:3px solid var(--amber);outline-offset:2px;transform:translateY(-2px)}
.pregunta{font-size:1.2rem;font-weight:bold;margin:4px 0 12px}
.contador{font-size:.95rem;color:var(--muted)}

/* Tabla */
.tabla-wrap{overflow-x:auto;border-radius:12px;border:2px solid var(--line)}
.tabla{border-collapse:collapse;width:100%;min-width:560px;background:var(--surface)}
.tabla th{background:var(--green);color:var(--th-ink);padding:11px 14px;text-align:left;font-size:1rem;cursor:pointer;white-space:nowrap}
.tabla td{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;height:46px}
.tabla td+td,.tabla th+th{border-left:1px solid var(--line)}
@media (hover:hover){.tabla tbody tr:hover td{background:var(--teal-soft)}}
button,.tabla td,.tabla th{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.clave-caja{max-width:640px;margin:18px auto 0;padding:14px 16px;border-radius:14px;background:var(--bg);border:2px solid var(--line)}
.clave{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.clave .opt{padding:10px 6px;min-height:48px;font-weight:bold}
.clave .opt:disabled{opacity:.45;cursor:not-allowed}
.clave-msg{margin:10px 0 0;color:var(--coral);font-weight:bold}
.tabla td.empty{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(127,127,127,.12) 6px 12px)}
.tabla .hl-row td,.tabla td.hl-col{background:var(--amber-soft)!important}
.tabla th.hl-col{background:var(--amber);color:#2A2010}
.tabla td.hl-cell{background:var(--amber-soft)!important;outline:3px solid var(--amber);outline-offset:-3px;font-weight:bold}
.tabla td.fixed{background:var(--ok-soft)!important;font-weight:bold}
.tabla td.ninguno{cursor:default;color:var(--muted);text-align:center}
.tabla th.newcol,.tabla td.newcol{animation:brillo 1.6s ease-out}
@keyframes brillo{0%{background:var(--amber)}100%{}}
.aparece{animation:entra .45s ease-out both}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Retroalimentación */
.fb{margin-top:14px;padding:12px 16px;border-radius:10px;border-left:6px solid var(--line);background:var(--bg)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.err{background:var(--coral-soft);border-color:var(--coral)}
.fb.info{background:var(--amber-soft);border-color:var(--amber)}
.reloj{padding:5px 12px;border-radius:20px;border:2px solid var(--teal);background:var(--surface);font-weight:bold;font-size:.9rem;font-variant-numeric:tabular-nums}
.reloj.poco{border-color:var(--amber);background:var(--amber-soft)}
.reloj.fuera{border-color:var(--coral);background:var(--coral-soft)}
.btn.sec{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.caja{margin-top:16px;padding:16px 18px;border-radius:14px;border:2px dashed var(--teal);background:var(--bg)}
.opciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
.opt:hover{border-color:var(--teal)}

/* Misión 2 */
.pedido{display:flex;gap:14px;align-items:flex-start;background:var(--amber-soft);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.pedido .icono{font-size:1.8rem;line-height:1}
.pedido q{font-size:1.15rem;font-weight:bold;quotes:"«" "»"}
.filtros{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:12px}
.grupo{display:flex;flex-direction:column;gap:6px}
.grupo .nombre{font-size:.9rem;color:var(--muted);font-weight:bold}
.grupo .botones{display:flex;gap:6px;flex-wrap:wrap}
.filtro{padding:7px 14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--th-ink);font-weight:bold}
.filtro:disabled{opacity:.5;cursor:not-allowed}
.grupo.nuevo{padding:6px 10px;border-radius:12px;background:var(--amber-soft)}
.adopcion{margin-top:16px;display:flex;gap:18px;align-items:center;padding:18px 20px;border-radius:14px;background:var(--ok-soft);border:2px solid var(--ok)}
.adopcion .sello-g{font-size:2.6rem}

/* Fin de misión e informe */
.fin{text-align:center}
.sello{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:3px solid var(--green);border-radius:30px;font-weight:bold;transform:rotate(-3deg);color:var(--green)}
.cumplida{color:var(--muted);margin:14px 0 4px}
.idea{display:inline-block;max-width:560px;background:var(--amber-soft);border-radius:14px;padding:16px 22px;font-size:1.25rem;font-weight:bold;margin:6px 0 16px}
.compartir{max-width:560px;margin:0 auto;padding:12px 16px;border:2px dashed var(--amber);border-radius:12px}
.espera{color:var(--muted);margin:18px 0 6px}
.cadena{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.eslabon{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.eslabon b{color:var(--green)}
.sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 16px}
.informe{text-align:left;max-width:640px;margin:0 auto}
.informe p{margin:6px 0}

footer{max-width:1100px;margin:0 auto;padding:0 18px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}
footer button{background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--muted);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90%;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.ver{opacity:1}

/* Problema: fichas desordenadas */
.mesa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0 18px}
.mesa .ficha{font-size:.92rem;line-height:1.6;padding:20px 14px 12px}
.mesa .ficha:nth-child(odd){transform:rotate(-2.5deg)}
.mesa .ficha:nth-child(3n){transform:rotate(2deg)}
.mesa .ficha:nth-child(4n){transform:rotate(-1deg) translateY(6px)}
/* Síntesis */
.ideas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.ideac{border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:var(--bg)}
.ideac b{display:block;font-size:1.05rem;letter-spacing:.04em}
.ideac.reg{border-color:var(--reg);background:var(--reg-soft)}
.ideac.cam{border-color:var(--cam);background:var(--cam-soft)}
.ideac.dat{border-color:var(--amber);background:var(--amber-soft)}
.def{margin:6px 0 4px;padding:14px 18px;border-radius:14px;background:var(--surface);border:2px solid var(--green);font-size:1.1rem}
.tabla .r-reg td{background:var(--reg-soft)!important}
.tabla td.c-cam,.tabla th.c-cam{background:var(--cam-soft)!important;color:var(--ink)}
.tabla td.c-dat{background:var(--amber-soft)!important;outline:3px solid var(--amber);outline-offset:-3px;font-weight:bold}
/* Material de clase */
.mat{margin:6px 0 10px;padding:16px 18px;border-radius:14px;border:2px solid var(--teal);background:var(--surface)}
.mat h3{margin:0 0 6px;font-size:1.1rem}
.mat ul{margin:6px 0;padding-left:20px}
.tarj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
/* Biblioteca */
.frase{width:100%;min-height:64px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.frase:focus{border-color:var(--teal);outline:none}
.saltar{margin-top:18px;text-align:right}
@media (max-width:760px){.mesa{grid-template-columns:repeat(2,minmax(0,1fr))}.ideas,.tarj{grid-template-columns:1fr}}
@media (max-width:520px){
  body{font-size:16px}
  .top{padding:10px 12px}
  main{padding:0 10px 24px}
  .tabla{min-width:0;font-size:.78rem}
  .tabla th{font-size:.78rem}
  .tabla th,.tabla td{padding:7px 4px;white-space:normal;word-break:break-word}
  .clave{grid-template-columns:repeat(2,minmax(0,1fr))}
  .equipos{max-width:none}
  .opt,.filtro,.chip{min-height:44px}
}
@media (max-width:760px){
  .portada,.m1-grid{grid-template-columns:1fr}
  .pila{height:230px}
  h1{font-size:1.8rem}
  .panel{padding:18px}
}
.tabla td.sindato{color:var(--muted);font-style:italic}
.btn-led{background:var(--amber);border-color:var(--amber);color:#2A2010;font-weight:bold}
.led-barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.led-volver{font-size:1.15rem;padding:14px 26px}
.led-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.led-tabs button{padding:6px 12px;border-radius:20px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9rem}
.led-tabs button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--th-ink);font-weight:bold}
.tv{font-size:1.3rem;line-height:1.45}
.tv h2{font-size:2rem}
.tv .preg{font-size:1.7rem;max-width:900px}
.tv .consigna{max-width:none}
.tv ol{margin:8px 0 8px;padding-left:1.4em}
.tv ol li{margin:6px 0}
.tv .ficha.grande{font-size:1.2rem}
.ampl{max-width:640px;margin:14px auto 0;padding:12px 16px;border-radius:12px;background:var(--teal-soft);border:2px dashed var(--teal);text-align:left}
.modo-tv .estado,.modo-tv .led-volver,.modo-tv .led-barra .etapa{display:none!important}
.repaso{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;align-items:start;margin:8px 0 14px}
.ficha.form{transform:rotate(-1.5deg);line-height:1.6}
.ficha.form .fq{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(63,50,29,.35);padding:3px 0}
.ficha.form .fq b{font-family:"Comic Sans MS","Segoe Print",cursive;color:#3B3BB0}
.ejemplo{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.ejemplo>span{font-size:1.8rem;line-height:1}
.ejemplo .tabla-wrap{margin-top:6px}
.ejemplo .tabla{min-width:0}
@media (max-width:760px){.repaso{grid-template-columns:1fr}}
.salon{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center;margin:8px 0 14px}
.frente{grid-column:1;text-align:center;font-weight:bold;color:var(--muted);border-bottom:4px solid var(--line);padding-bottom:6px;font-size:.95rem}
.bancos{grid-column:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.banco{height:42px;border-radius:8px;border:2px solid var(--line);background:var(--bg)}
.banco.reg{background:var(--reg-soft);border-color:var(--reg)}
.banco.cam{background:var(--cam-soft);border-color:var(--cam)}
.banco.dato{background:var(--amber);border-color:var(--amber)}
.salon .ref{grid-column:2;grid-row:1/3;display:grid;gap:10px}
@media (max-width:760px){.salon{grid-template-columns:1fr}.salon .ref{grid-column:1;grid-row:auto}}
.clave-in{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.clave-txt{font:inherit;font-size:1.3rem;font-weight:bold;text-align:center;width:220px;max-width:100%;padding:10px 12px;border-radius:12px;border:3px solid var(--green);background:var(--surface);color:var(--ink)}
.clave-txt:disabled{opacity:.5}
.compacta .tabla td{height:auto;padding:5px 14px}
.modo-tv .compacta .tabla td{padding:4px 14px}
.compacta .tabla th{padding:7px 14px}
.dos-op{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:820px;margin:18px auto 0;text-align:center}
.op-caja{border:3px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:6px}
.op-tit{margin:0;font-weight:bold;font-size:1.15rem}
.op-txt{margin:0;font-size:.95rem;color:var(--muted)}
.btn-led-g{background:var(--amber);color:#2A2010}
@media (max-width:640px){.dos-op{grid-template-columns:1fr}}
.clave-aviso{margin:18px auto 0;max-width:900px;text-align:center;font-weight:bold;padding:10px 14px;border-radius:12px;background:var(--teal-soft);border:2px solid var(--teal)}
.reloj-tv-caja{display:none}

<script>
/* ================================================================
   ZONA EDITABLE · Refugio Patitas (8.º 4 · 3/11)
   - CLAVES: contraseñas que dice el docente (1: Rocco · 2: Canela · 3: Simón)
   - DUR: misión 1: 8 min · misión 2: 9 min · desafío extra (biblioteca): 4 min

   - ESPACIO DOCENTE: botón «👤 Docente» del pie + CLAVE_DOCENTE (más abajo). Muestra la vista para la TV con todos los momentos de la clase
   - LIBROS: la tabla del desafío final (biblioteca)
   - BASE: los 8 animales de la tabla
   - NOTAS: notas de la veterinaria para completar el campo nuevo
   ================================================================ */
const CAMPOS=[{k:'n',l:'Nombre'},{k:'e',l:'Especie'},{k:'a',l:'Edad'},{k:'t',l:'Tamaño'},{k:'c',l:'Color'}];
const NINOS={k:'k',l:'¿Se lleva bien con niños?'};
const BASE=[
  {id:'Luna',n:'Luna',e:'Perro',a:'2',t:'Pequeño',c:'Blanco',k:'No'},
  {id:'Simón',n:'Simón',e:'Gato',a:'4',t:'Pequeño',c:'Negro',k:''},
  {id:'Tango',n:'Tango',e:'Perro',a:'5',t:'Grande',c:'Marrón',k:''},
  {id:'Mora',n:'Mora',e:'Perro',a:'1',t:'Pequeño',c:'Negro',k:'No'},
  {id:'Pelusa',n:'Pelusa',e:'Gato',a:'3',t:'Pequeño',c:'Gris',k:''},
  {id:'Rocco',n:'Rocco',e:'Perro',a:'7',t:'Mediano',c:'Marrón',k:''},
  {id:'Nina',n:'Nina',e:'Perro',a:'3',t:'Pequeño',c:'Marrón',k:'Sí'},
  {id:'Canela',n:'Canela',e:'Conejo',a:'1',t:'Pequeño',c:'Blanco',k:''}
];
const CHIPS=[{v:'Pequeño',k:'t'},{v:'Luna',k:'n'},{v:'Blanco',k:'c'},{v:'2',k:'a'},{v:'Perro',k:'e'}];
const TAREAS=['Toquen el registro de Tango.','Toquen el campo Edad.','Toquen el dato que indica de qué especie es Pelusa.','¿Cuántos registros y cuántos campos tiene esta tabla? Cuenten y elijan.'];

const CAMPO_BAD=['Las vacunas son importantes para adoptar, pero no dicen si el animal convive bien con niños.','','Ese dato le sirve al refugio, pero no responde lo que pide la familia.'];

/* Desafío final: tres preguntas breves de biblioteca (datos inventados) */
const LCAMPOS=[{k:'ti',l:'Título'},{k:'au',l:'Autor'},{k:'an',l:'Año'},{k:'pa',l:'Páginas'},{k:'es',l:'Estante'}];

  {id:'b1',ti:'La isla del faro',au:'Ana Correa',an:'2019',pa:'180',es:'1'},
  {id:'b2',ti:'El reloj de arena',au:'Martín Silva',an:'2021',pa:'132',es:'3'},
  {id:'b3',ti:'Cielo de papel',au:'Lucía Méndez',an:'2018',pa:'96',es:'2'},

  {id:'b5',ti:'La huerta del liceo',au:'Sofía Pérez',an:'2020',pa:'64',es:'4'},
  {id:'b6',ti:'Mapas del sur',au:'Diego Ferreira',an:'2017',pa:'150',es:'2'}
];
const MARCAS=[{t:'row',r:'b2',ok:'Registro',x:'la fila de «El reloj de arena»'},{t:'col',c:'an',ok:'Campo',x:'la columna Año'},{t:'cell',r:'b1',c:'es',ok:'Dato',x:'el «1» de la fila de «La isla del faro», en la columna Estante'}];
const BCUENTA=['6 registros y 5 campos','5 registros y 6 campos','30 registros y 5 campos'];
const BCUENTA_BAD=['','Revisen: los registros son las filas (cada libro) y los campos son las columnas.','30 es la cantidad de datos (celdas): 6 filas por 5 columnas. ¿Cuántas filas hay?'];
const BCAMPO=['Agregar Editorial.','Agregar Género y completar sus datos.','Usar Páginas para buscar aventura.'];
const BCAMPO_BAD=['La editorial no nos dice de qué tipo es el libro.','','El número de páginas no informa a qué género pertenece un libro.'];

const $app=document.getElementById('app');
let S=nuevo();
function nuevo(){return{team:null,scr:'start',
  m1:{placed:{},sel:null,saved:false,task:0,solved:false,fb:null,done:false},
  m2:{f:{e:null,t:null,k:null},stage:'filter',added:false,fb:null,fill:{},just:null,done:false},
  bib:{q:0,solved:false,fb:null,done:false},mat:false,
  att:{},help:{},timer:null,tiempos:{},lockUntil:0,claveMsg:null,claveOpen:false,say:'',hint:'',led:false,ledTab:null,just1:null};}
const DESC={n:'el nombre de Luna',e:'qué animal es',a:'cuántos años tiene',t:'qué tan grande es',c:'de qué color es'};
const AYUDA_T=['Segundo intento. Miren la fila marcada: es el registro de Tango, con todos sus datos.','Segundo intento. Miren la columna marcada: es el campo Edad, con la edad de todos los animales.','Segundo intento. Miren la celda marcada: «Gato» es el dato que indica la especie de Pelusa.','Segundo intento. Hay 8 filas (8 animales): 8 registros. Hay 5 columnas (Nombre, Especie, Edad, Tamaño, Color): 5 campos.'];
const CLAVES={1:'Rocco',2:'Canela',3:'Simón'};   /* contraseñas que dice el docente (también en el panel docente) */
const EMO={'Luna':'🐶','Simón':'🐱','Tango':'🐕','Mora':'🐶','Pelusa':'🐱','Rocco':'🐕','Nina':'🐶','Canela':'🐰'};
const KEY='refugioPatitas_3nov_v2';
function guardar(){try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),s:S}));}catch(e){}}
function cargar(){try{const g=JSON.parse(localStorage.getItem(KEY)||'null');if(g&&g.s&&['prob','m1a','m1b','m1end','m2','m2end','sint','bib','report'].includes(g.s.scr)&&Date.now()-g.t<90*60000)return g.s;}catch(e){}return null;}
function fallo(id){S.att[id]=(S.att[id]||0)+1;return S.att[id]>=2;}
const DUR={1:480,2:540,3:240};
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtT(s){const m=Math.floor(s/60),r=s%60;return (m?m+' min ':'')+r+' s';}
function iniciarReloj(n){S.timer={n,ini:Date.now(),aviso:false};tick();}
function pararReloj(){if(S.timer){S.tiempos[S.timer.n]=Math.round((Date.now()-S.timer.ini)/1000);S.timer=null;}tick();}
function tick(){
  const el=document.getElementById('reloj');
  if(!S.timer){el.hidden=true;return;}
  const rest=DUR[S.timer.n]-Math.floor((Date.now()-S.timer.ini)/1000);
  el.hidden=false;
  if(rest>0){el.textContent='⏱ '+fmt(rest);el.classList.toggle('poco',rest<=60);el.classList.remove('fuera');}
  else{el.textContent='⏱ Tiempo cumplido';el.classList.remove('poco');el.classList.add('fuera');
    if(!S.timer.aviso){S.timer.aviso=true;toast('Se terminó el tiempo sugerido para esta misión. Terminen el paso en el que están.');}}
}
setInterval(tick,1000);
function sinAyuda(pref,total){return total-Object.keys(S.help).filter(k=>k.startsWith(pref)).length;}
function primerIntento(pref,total){return total-Object.keys(S.att).filter(k=>k.startsWith(pref)).length;}
let armado=null;
function reiniciar(){
  const b=document.getElementById('btnReiniciar');
  if(!armado){
    b.textContent='⚠️ Se borra TODO lo del equipo. Toquen de nuevo para confirmar';
    armado=setTimeout(()=>{armado=null;b.textContent='Nueva partida';},5000);
    return;
  }
  clearTimeout(armado);armado=null;b.textContent='Nueva partida';
  {
    try{speechSynthesis.cancel();}catch(e){}
    try{localStorage.removeItem(KEY);}catch(e){}
    S=nuevo();render();tick();window.scrollTo(0,0);
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function lab(k){return k==='k'?NINOS.l:CAMPOS.find(c=>c.k===k).l;}
function fbHTML(fb){return fb?`<div class="fb ${fb.t}" role="status">${esc(fb.x)}</div>`:'';}

function tabla(rows,cols,o){
  o=o||{};
  let h='<div class="tabla-wrap"><table class="tabla"><thead><tr>';
  cols.forEach(c=>{h+=`<th tabindex="0" data-act="head" data-c="${c.k}" class="${o.hc?o.hc(c):''}${o.newCol===c.k?' newcol':''}">${esc(c.l)}</th>`;});
  h+='</tr></thead><tbody>';
  if(!rows.length){h+=`<tr><td class="ninguno" colspan="${cols.length}">Ningún registro tiene esos datos. Prueben con otros filtros.</td></tr>`;}
  rows.forEach((r,i)=>{
    h+=`<tr class="${o.rc?o.rc(r,i):''}"${o.rs?` style="${o.rs(r,i)}"`:''}>`;
    cols.forEach(c=>{
      const v=o.val?o.val(r,c):r[c.k];
      h+=`<td tabindex="0" data-act="cell" data-r="${esc(r.id)}" data-c="${c.k}" class="${o.cc?o.cc(r,c):''}${v===''?' empty':''}${o.newCol===c.k?' newcol':''}">${v===''?'<span class="sr">vacío</span>':esc(v)}</td>`;
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

function numMision(){return{start:0,prob:0,m1a:1,m1b:1,m1end:1,m2:2,m2end:2,sint:2,bib:3,report:4}[S.scr];}
function cabecera(){
  const cur=numMision(),fin=/end$/.test(S.scr)||S.scr==='sint';
  let h='';
  ['Misión 1','Misión 2','Extra'].forEach((t,i)=>{
    const n=i+1;
    const c=(n<cur||(n===cur&&fin)||cur===4)?'hecho':(n===cur?'actual':'');
    h+=`<span class="paso ${c}">${t}</span>`;
  });
  document.getElementById('pasos').innerHTML=h;
  const eq=document.getElementById('equipo');
  if(S.team){eq.hidden=false;eq.textContent='Equipo '+S.team;}else eq.hidden=true;
}

function render(){
  let h='';
  switch(S.scr){
    case 'start':h=vStart();break;
    case 'prob':h=vProb();break;
    case 'm1a':h=vM1a();break;
    case 'm1b':h=vM1b();break;
    case 'm1end':h=vFin(1,'Sello de fichas','¿Qué diferencia hay entre un registro y un campo? Den un ejemplo de la tabla.','Ir a la misión 2');break;
    case 'm2':h=vM2();break;
    case 'm2end':h=vFin(2,'Sello de adopción','¿Qué campo tuvieron que agregar y por qué ese y no otro? ¿Alcanzaba con agregar la columna vacía?','Ir a la síntesis');break;
    case 'sint':h=vSint();break;
    case 'bib':h=vBib();break;
    case 'report':h=vInforme();break;
  }
  if(S.led)h=vLed();
  $app.innerHTML=(S.mat&&!S.led?vMaterial():'')+h;
  const bl=document.getElementById('btnLed');bl.setAttribute('aria-pressed',S.led?'true':'false');bl.textContent=S.led?'↩ Volver a mi trabajo':'📺 Ver la TV';
  const bm=document.getElementById('btnMaterial');bm.setAttribute('aria-expanded',S.mat?'true':'false');
  cabecera();
  guardar();
}

function vStart(){
  S.say='Refugio Patitas. Las fichas de los animales del refugio están desordenadas y cuesta encontrar la mascota que busca cada familia. Ustedes son el equipo de informática: van a organizar los datos para que cada animal encuentre una familia. Elijan el número de equipo que está en su ficha.';

  for(let i=1;i<=15;i++)eq+=`<button type="button" data-act="team" data-v="${i}" aria-pressed="${S.team===i}">${i}</button>`;
  return `<section class="panel"><div class="portada">
    <div class="pila" aria-hidden="true">
      <div class="ficha"><span class="titulo">Tango</span><br>perro grande, marrón<br>5 años</div>
      <div class="ficha"><span class="titulo">Pelusa</span><br>gata gris, 3 años<br>pequeña</div>
      <div class="ficha"><span class="titulo">Luna</span><br>perrita blanca<br>2 años · pequeña</div>
    </div>
    <div>
      <h1>Refugio Patitas</h1>
      <p class="consigna">Las fichas de los animales están desordenadas y cuesta encontrar la mascota que busca cada familia. Ustedes son el equipo de informática del refugio: van a organizar los datos para que cada animal encuentre una familia.</p>
      <div class="roles">
        <div class="rolc"><span class="ri" aria-hidden="true">🖱️</span><span><b>El operador</b>toca la Ceibal</span></div>
        <div class="rolc"><span class="ri" aria-hidden="true">📋</span><span><b>El revisor</b>lee y dice qué tocar</span></div>
        <div class="rolc tres"><span class="ri" aria-hidden="true">🗣️</span><span><b>Si son 3: el vocero</b>cuenta a la clase lo que hicieron</span></div>
      </div>
      <p class="contador" style="margin:2px 0 12px">Cambian de rol en cada misión.</p>
      <p><strong>¿Qué número de equipo son?</strong> (el número de su ficha)</p>
      <div class="equipos">${eq}</div>
      <div class="acciones"><button class="btn" type="button" data-act="start" ${S.team?'':'disabled'}>Empezar</button></div>
    </div>
  </div></section>`;
}

  S.say='El problema del refugio. Estas son las fichas de los animales, escritas a mano y todas mezcladas. Llegó un pedido de adopción: queremos adoptar un perro pequeño que se lleve bien con niños. ¿Qué animal le darían? ¿Se puede saber con estas fichas? Esperen al profe para empezar.';

    <div class="acciones" style="justify-content:center"><button class="btn" type="button" data-act="empezarM1">Empezar la misión 1</button></div>
  </section>`;

function vMaterial(){
  const sc=S.scr,tar=`<div class="tarj"><div class="ideac reg"><b>REGISTRO</b>fila: los datos de un elemento</div><div class="ideac cam"><b>CAMPO</b>columna: una característica de todos</div><div class="ideac dat"><b>DATO</b>intersección (cruce) de fila y columna: un valor</div></div>`;

function vSint(){

  const clave=tab==='pc1'?`<p class="clave-aviso">🔑 Al terminar la puesta en común, el profe dice la clave para seguir.</p>`:tab==='pc2'?`<p class="clave-aviso">💻 Al terminar, bajen las tapas: seguimos en el pizarrón.</p>`:'';
  const mins={m1:8,m2:9}[tab];
  const reloj=(tvOn&&mins)?`<div class="reloj-tv-caja"><span class="reloj-tv" id="relojTv">${fmtRelojTv(tab,mins)}</span><button type="button" class="mini" data-act="tvReloj" data-v="go" data-m="${mins}">▶ Iniciar</button><button type="button" class="mini" data-act="tvReloj" data-v="pausa">⏸ Pausar</button><button type="button" class="mini" data-act="tvReloj" data-v="cero" data-m="${mins}">↺</button></div>`:'';
  const nav=tvOn?`<div class="tv-nav"><button type="button" class="btn sec" data-act="ledTab" data-v="${LED_TABS[Math.max(0,i-1)][0]}" ${i===0?'disabled':''}>◀ Anterior</button><span class="tv-paso">${i+1} de ${LED_TABS.length} · ${LED_TABS[i][1]}</span><button type="button" class="btn" data-act="ledTab" data-v="${LED_TABS[Math.min(LED_TABS.length-1,i+1)][0]}" ${i===LED_TABS.length-1?'disabled':''}>Siguiente ▶</button></div>`:'';
  return `<section class="panel">
    <div class="led-barra"><p class="etapa" style="margin:0">📺 LED · Lo que se proyecta en la TV</p>${volver}</div>
    ${tabs}
    ${reloj}
    <div class="tv">${c}${clave}</div>
    ${nav}
    <div class="acciones" style="justify-content:center;margin-top:22px">${volver}</div>
  </section>`;
}
/* Reloj grande para la TV (solo en el espacio docente, durante las misiones) */
let relojTv={tab:null,fin:0,resto:0,corre:false};
function fmtRelojTv(tab,mins){let r;if(relojTv.tab!==tab)r=mins*60;else r=relojTv.corre?Math.max(0,Math.round((relojTv.fin-Date.now())/1000)):relojTv.resto;return Math.floor(r/60)+':'+String(r%60).padStart(2,'0');}
setInterval(()=>{const el=document.getElementById('relojTv');if(el&&relojTv.corre&&S.ledTab===relojTv.tab){const r=Math.max(0,Math.round((relojTv.fin-Date.now())/1000));el.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');el.classList.toggle('poco',r<=60);if(!r)relojTv.corre=false;}},500);

function normClave(x){return String(x||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function claveBotones(n){

  return `<div class="clave-in"><label for="clave${n}" class="sr">Clave del profe</label><input id="clave${n}" class="clave-txt" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Clave" data-n="${n}" ${bloq?'disabled':''}><button type="button" class="btn" data-act="claveIn" data-n="${n}" ${bloq?'disabled':''}>Seguir</button></div>
      ${S.claveMsg?`<p class="clave-msg" role="status">${esc(S.claveMsg)}</p>`:''}`;
}

function claveEnMision(n){

}

    <p class="espera" style="margin:6px 0 0">${n===2?'Cuando el profe lo indique, bajen las tapas: el cierre es en el pizarrón.':'Esperen al profe: lo vamos a conversar entre todos.'}</p>

  return `Pasaron la ficha de Luna a la tabla y respondieron ${r} de 4 preguntas sobre registros, campos y datos.`;
}
function avanceM2(){

  return {filter:'Empezaron a consultar la base con filtros.',

}

    <div class="informe">
      <p><strong>Misión 1.</strong> ${p1}</p>

function accion(act,d){
  const m1=S.m1,m2=S.m2;
  if(act==='team'){S.team=+d.v;return render();}
  if(act==='start'){if(S.team){S.scr='prob';render();window.scrollTo(0,0);}return;}
  if(act==='empezarM1'){S.scr='m1a';iniciarReloj(1);window.scrollTo(0,0);return render();}
  if(act==='cerrarMat'){S.mat=false;return render();}
  if(act==='ledVolver'){cerrarLed();return;}
  if(act==='ledOpen'){abrirLed();return;}
  if(act==='ledTab'){const tope=document.body.classList.contains('modo-tv')?LED_TABS.length-1:LED_TABS.findIndex(x=>x[0]===ledEtapa());if(LED_TABS.findIndex(x=>x[0]===d.v)>tope)return;S.ledTab=d.v;render();window.scrollTo(0,0);return;}
  if(act==='tvReloj'){const tab=S.ledTab,m=+d.m||0;
    if(d.v==='go'){const base=(relojTv.tab===tab&&!relojTv.corre&&relojTv.resto>0)?relojTv.resto:(relojTv.tab===tab&&relojTv.corre?null:m*60);if(base!==null){relojTv={tab,fin:Date.now()+base*1000,resto:base,corre:true};}}
    else if(d.v==='pausa'&&relojTv.tab===tab&&relojTv.corre){relojTv.resto=Math.max(0,Math.round((relojTv.fin-Date.now())/1000));relojTv.corre=false;}
    else if(d.v==='cero'){relojTv={tab,fin:0,resto:m*60,corre:false};}
    render();return;}
  if(S.led)return;
  if(S.scr==='m1a'&&!m1.saved){
    if(act==='chip'){m1.sel=(m1.sel===d.v)?null:d.v;m1.fb=null;return render();}
    if(act==='head'||act==='cell'){
      if(!m1.sel){m1.fb={t:'err',x:'Primero toquen un dato de la ficha y después la columna donde va.'};return render();}
      const ch=CHIPS.find(x=>x.v===m1.sel);
      if(ch.k===d.c){m1.placed[ch.k]=ch.v;m1.fb={t:'ok',x:`Bien: «${ch.v}» va en el campo ${lab(d.c)}.`};}
      else{
        const id='m1-'+ch.k;
        if(fallo(id)){m1.placed[ch.k]=ch.v;S.help[id]=1;m1.fb={t:'info',x:`Segundo intento. «${ch.v}» va en el campo ${lab(ch.k)}: indica ${DESC[ch.k]}.`};}
        else m1.fb={t:'err',x:`«${ch.v}» no va en el campo ${lab(d.c)}. ¿Qué característica de Luna describe este dato? Les queda un intento.`};
      }
      m1.sel=null;return render();
    }
    if(act==='saveLuna'){m1.saved=true;m1.fb=null;return render();}
  }
  if(act==='toM1b'){S.scr='m1b';m1.fb=null;window.scrollTo(0,0);return render();}
  if(S.scr==='m1b'){
    if(act==='nextTask'){if(m1.task<3){m1.task++;m1.solved=false;m1.fb=null;}else{m1.done=true;S.scr='m1end';pararReloj();}window.scrollTo(0,0);return render();}
    if(act==='cuenta'&&!m1.solved){
      if(d.v==='0'){m1.solved=true;m1.fb={t:'ok',x:'Correcto: 8 animales son 8 registros (filas) y 5 características son 5 campos (columnas).'};}
      else if(fallo('m1b-3')){S.help['m1b-3']=1;m1.solved=true;m1.fb={t:'info',x:AYUDA_T[3]};}
      else m1.fb={t:'err',x:'Revisen: ¿cuántas filas hay? ¿Cuántas columnas? Les queda un intento.'};
      return render();
    }
    if((act==='head'||act==='cell')&&!m1.solved){
      const t=m1.task,r=d.r,c=d.c,cab=act==='head';
      let ok=false,x='';
      if(t===0){
        if(cab)x='Eso es una columna. Un registro es una fila: busquen la fila de Tango.';
        else if(r==='Tango'){ok=true;x='Correcto: esa fila es el registro de Tango. Reúne todos sus datos.';}
        else x=`Esa es la fila de ${r}. Busquen la de Tango.`;
      }else if(t===1){
        if(c==='a'){ok=true;x='Correcto: la columna Edad es un campo. Guarda la misma característica de todos los animales.';}
        else x=`Esa es la columna ${lab(c)}. Busquen la columna Edad.`;
      }else{
        if(cab)x='Ese es el nombre de un campo, no un dato. Toquen una celda de la tabla.';
        else if(r==='Pelusa'&&c==='e'){ok=true;x='Correcto: «Gato» es un dato. Está en el registro de Pelusa y en el campo Especie.';}
        else if(r==='Pelusa')x=`Ese dato es de Pelusa, pero corresponde al campo ${lab(c)}.`;
        else if(c==='e')x=`Ese dato es la especie de ${r}. Busquen la fila de Pelusa.`;
        else x=`Ese dato es de ${r} y está en el campo ${lab(c)}. Busquen la fila de Pelusa y la columna Especie.`;
      }
      if(!ok){const id='m1b-'+t;if(fallo(id)){S.help[id]=1;m1.solved=true;m1.fb={t:'info',x:AYUDA_T[t]};return render();}x+=' Les queda un intento.';}
      m1.solved=ok;m1.fb={t:ok?'ok':'err',x};return render();
    }
  }
  if(S.scr==='m2'){
    m2.justAdded=false;
    if(act==='filt'){
      m2.f[d.k]=(m2.f[d.k]===d.v)?null:d.v;m2.fb=null;
      const f=m2.f;
      if(m2.stage==='filter'&&f.e==='Perro'&&f.t==='Pequeño')m2.stage='ask';
      else if(m2.stage==='filter2'&&f.e==='Perro'&&f.t==='Pequeño'&&f.k==='Sí'){m2.stage='done';m2.fb=null;}
      return render();
    }
    if(act==='clearF'){m2.f={e:null,t:null,k:null};m2.fb=null;return render();}
    if(act==='ask'){
      if(d.v==='none'){m2.stage='field';m2.fb={t:'ok',x:'Exacto: la tabla no nos dice eso.'};}
      else if(fallo('m2-ask')){S.help['m2-ask']=1;m2.stage='field';m2.fb={t:'info',x:'Segundo intento. Ningún campo de la tabla dice si el animal se lleva bien con niños: la tabla no tiene ese dato.'};}
      else m2.fb={t:'err',x:`¿Qué dato de la tabla les confirma que ${d.v} se lleva bien con niños? Revisen los campos. Les queda un intento.`};
      return render();
    }
    if(act==='field'){
      const i=+d.v;
      if(i===1){m2.added=true;m2.justAdded=true;m2.stage='fill';m2.fb={t:'ok',x:'Campo agregado. Miren la columna nueva: está vacía.'};}
      else if(fallo('m2-field')){S.help['m2-field']=1;m2.added=true;m2.justAdded=true;m2.stage='fill';m2.fb={t:'info',x:'Segundo intento. El campo que hace falta es «¿Se lleva bien con niños?». Miren la columna nueva: está vacía.'};}
      else m2.fb={t:'err',x:CAMPO_BAD[i]+' Les queda un intento.'};
      return render();
    }
    if(act==='fill'){
      const n=NOTAS.find(x=>x.id===d.r);
      if(d.v===n.v){m2.fill[n.id]=n.v;m2.fb={t:'ok',x:`Bien: ${n.id} → «${n.v}».`};}
      else if(fallo('m2-fill-'+n.id)){S.help['m2-fill-'+n.id]=1;m2.fill[n.id]=n.v;m2.fb={t:'info',x:`Segundo intento. La nota dice: «${n.x}» Por eso va «${n.v}».`};}
      else m2.fb={t:'err',x:`Vuelvan a leer la nota de ${n.id}. Les queda un intento.`};
      if(NOTAS.every(x=>m2.fill[x.id]===x.v)){m2.stage='justify';m2.fb={t:'ok',x:'¡Campo completo! Ahora la base sí tiene el dato.'};}
      return render();
    }
    if(act==='just'){
      if(S.just1===null)S.just1=+d.v;
      if(d.v==='0'){m2.just=0;m2.stage='filter2';m2.fb={t:'ok',x:'Exacto: la consulta de la familia necesita ese dato. Ahora usen el filtro nuevo.'};}
      else if(fallo('m2-just')){S.help['m2-just']=1;m2.just=0;m2.stage='filter2';m2.fb={t:'info',x:'Segundo intento. Lo agregamos porque es lo que pide la familia: sin ese dato no se puede responder la consulta. Ahora usen el filtro nuevo.'};}
      else m2.fb={t:'err',x:'Tener más columnas no ayuda por sí solo. ¿Qué dice el pedido de la familia? Les queda un intento.'};
      return render();
    }
    if(act==='toM2end'){m2.done=true;S.scr='m2end';pararReloj();window.scrollTo(0,0);return render();}
    if(act==='head'||act==='cell')return;
  }
  if(act==='restart'){reiniciar();return;}
  if(act==='abrirClave'){S.claveOpen=true;return render();}
  if(act==='cerrarClave'){S.claveOpen=false;return render();}
  if(act==='claveIn'){const el=document.getElementById('clave'+d.n);act='clave';d={n:d.n,v:el?el.value:''};}
  if(act==='clave'){
    if(S.lockUntil>Date.now())return;
    const n=+d.n;
    if(normClave(d.v)&&normClave(d.v)===normClave(CLAVES[n])){
      S.claveMsg=null;S.lockUntil=0;S.claveOpen=false;
      if(S.timer)pararReloj();
      if(n===1){S.scr='m2';iniciarReloj(2);}
      else if(n===2){S.scr='sint';}
      else{S.scr='bib';iniciarReloj(3);}
      window.scrollTo(0,0);return render();
    }
    S.lockUntil=Date.now()+15000;
    S.claveMsg='Esa no es la clave. Esperen a que el profe la diga (15 segundos).';
    render();
    setTimeout(()=>{if(S.lockUntil&&S.lockUntil<=Date.now()){S.lockUntil=0;S.claveMsg='Esperen a que el profe diga la clave.';render();}},15100);
    return;
  }
  if(act==='toReport'){S.scr='report';window.scrollTo(0,0);return render();}
  if(S.scr==='bib'){
    const b=S.bib;
    const resolver=(ok,id,okx,badx,ayudax)=>{
      if(ok){b.solved=true;b.fb={t:'ok',x:okx};}
      else if(fallo(id)){S.help[id]=1;b.solved=true;b.fb={t:'info',x:ayudax};}
      else b.fb={t:'err',x:badx+' Les queda un intento.'};
      return render();
    };
    if(act==='bq1'&&!b.solved){const m=MARCAS[2];
      return resolver(d.v===m.ok,'b-p1',`Correcto: ${m.x} es un ${m.ok.toLowerCase()}.`,
        `Revisen: ¿está marcada una fila entera, una columna entera o una sola celda?`,
        `Segundo intento. Está marcado ${m.x}: es un ${m.ok.toLowerCase()}.`);}
    if(act==='bq2'&&!b.solved)return resolver(d.v==='0','b-p2','Correcto: 6 libros son 6 registros (filas) y 5 características son 5 campos (columnas).',BCUENTA_BAD[+d.v]||'Revisen la cuenta.','Segundo intento. Hay 6 filas (6 libros): 6 registros. Hay 5 columnas: 5 campos.');
    if(act==='bq3'&&!b.solved)return resolver(d.v==='1','b-p3','Correcto: agregar Género y completar sus datos permite filtrar por Género = Aventura.',BCAMPO_BAD[+d.v]||'Revisen.','Segundo intento. Hay que agregar el campo Género y completar sus datos para poder buscar los libros de aventura.');
    if(act==='bNext'&&b.solved){if(b.q===2){b.done=true;if(S.timer)pararReloj();S.scr='report';}else{b.q++;b.solved=false;b.fb=null;}window.scrollTo(0,0);return render();}
    if(act==='bInforme'){if(S.timer)pararReloj();S.scr='report';window.scrollTo(0,0);return render();}
  }
}

$app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  accion(t.dataset.act,t.dataset);
});
$app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('clave-txt')){e.preventDefault();accion('claveIn',{n:e.target.dataset.n});return;}
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target.closest('td[data-act],th[data-act]');
  if(!t)return;
  e.preventDefault();
  accion(t.dataset.act,t.dataset);
});

let tt;
function toast(x){const el=document.getElementById('toast');el.textContent=x;el.classList.add('ver');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('ver'),5000);}
document.getElementById('btnAyuda').addEventListener('click',()=>toast(S.hint));
document.getElementById('btnEscuchar').addEventListener('click',()=>{
  try{
    if(!('speechSynthesis' in window))throw new Error();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(S.say);u.lang='es-ES';u.rate=.95;try{const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^es[-_](UY|AR)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang));if(v){u.voice=v;u.lang=v.lang;}}catch(e){}
    speechSynthesis.speak(u);
  }catch(e){toast('La lectura en voz alta no está disponible en esta computadora.');}
});
document.getElementById('btnReiniciar').addEventListener('click',reiniciar);
document.getElementById('btnLed').addEventListener('click',()=>{S.led?cerrarLed():abrirLed();});
function setModoTv(on){
  document.body.classList.toggle('modo-tv',on);
  const bt=document.getElementById('btnTv');bt.hidden=!on;bt.textContent='Salir del modo TV';
  try{sessionStorage.setItem('refugioTv',on?'1':'');}catch(e){}
  if(on&&!S.led){S.led=true;S.ledTab=S.ledTab||'portada';}
  if(!on&&S.led){S.led=false;}
  render();window.scrollTo(0,0);
}
document.getElementById('btnTv').addEventListener('click',()=>setModoTv(false));
/* Espacio docente: botón «Docente» del pie + clave numérica (ZONA EDITABLE: CLAVE_DOCENTE). */
const CLAVE_DOCENTE='1973';
let pinFallos=0,pinBloqueo=0;
function pedirClaveDocente(){
  const v=document.getElementById('pinBox');if(v){v.remove();}
  const d=document.createElement('div');d.id='pinBox';d.className='pin-fondo';
  d.innerHTML=`<div class="pin-caja" role="dialog" aria-label="Acceso docente"><p class="op-tit">👤 Acceso docente</p><p class="op-txt">Este espacio es solo para el profe.</p>
    <input id="pinIn" class="clave-txt" type="password" inputmode="numeric" autocomplete="off" placeholder="Clave" aria-label="Clave docente">
    <div class="acciones" style="justify-content:center"><button type="button" class="btn sec" id="pinNo">Cancelar</button><button type="button" class="btn" id="pinSi">Entrar</button></div>
    <p class="clave-msg" id="pinMsg" role="status"></p></div>`;
  document.body.appendChild(d);
  const inp=document.getElementById('pinIn');inp.focus();
  const probar=()=>{
    const msg=document.getElementById('pinMsg');
    if(Date.now()<pinBloqueo){msg.textContent='Esperen un minuto para volver a intentar.';return;}
    if(inp.value===CLAVE_DOCENTE){pinFallos=0;d.remove();setModoTv(true);return;}
    pinFallos++;inp.value='';
    if(pinFallos>=3){pinBloqueo=Date.now()+60000;pinFallos=0;msg.textContent='Clave incorrecta. Espacio bloqueado por un minuto.';}
    else msg.textContent='Clave incorrecta.';
  };
  document.getElementById('pinSi').onclick=probar;
  document.getElementById('pinNo').onclick=()=>d.remove();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();probar();}if(e.key==='Escape')d.remove();});
}
document.getElementById('btnDocente').addEventListener('click',pedirClaveDocente);
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('modo-tv')||!S.led)return;if(e.target&&e.target.tagName==='INPUT')return;
  const i=LED_TABS.findIndex(x=>x[0]===(S.ledTab||'portada'));
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();S.ledTab=LED_TABS[Math.min(LED_TABS.length-1,i+1)][0];render();window.scrollTo(0,0);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();S.ledTab=LED_TABS[Math.max(0,i-1)][0];render();window.scrollTo(0,0);}});
document.getElementById('btnMaterial').addEventListener('click',()=>{S.mat=!S.mat;render();if(S.mat)window.scrollTo(0,0);});
const previo=cargar();
if(previo){S=Object.assign(nuevo(),previo);S.lockUntil=0;S.claveMsg=null;S.led=false;}
render();tick();
try{if(sessionStorage.getItem('refugioTv')==='1')setModoTv(true);}catch(e){}
if(previo&&!document.body.classList.contains('modo-tv'))toast('Se recuperó el avance del equipo '+S.team+'.');
</script>
